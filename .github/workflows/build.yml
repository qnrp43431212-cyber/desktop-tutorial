name: Build MURIM LIFE NeoForge 1.21.1
on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Verify checkout is v1.26.3 with Java hotfix
        run: |
          echo "Git commit: $(git rev-parse --short HEAD)"
          python3 scripts/check_hotfix_v1263.py
      - name: Verify independent rules
        run: |
          bash scripts/test_rules_v16.sh
          python3 scripts/verify_v16_assets.py
          bash scripts/test_v123.sh
      - name: Compile and build NeoForge mod
        run: |
          set -o pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon build --stacktrace 2>&1 | tee build_log.txt
        shell: bash
      - name: Upload built JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: murimlife-1.21.1-neoforge-dev
          path: build/libs/*.jar
          if-no-files-found: error
      - name: Upload failure build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: murimlife-build-log
          path: build_log.txt
          if-no-files-found: ignore
